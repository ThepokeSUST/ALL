<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #res {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  opacity: 0;
  transform: scale(0.4);
  transition: all 0.4s ease;
}

#res.show {
  opacity: 1;
  transform: scale(1);

}

 #res.success {
  color: #026911;
}

#res.error {
  color: red;
} 

    </style>
</head>
<body style="background-color: black;color: white;">
       <h2 style="background-color: rgb(9, 118, 78); text-align: center; width: 300px; margin-left: auto; margin-right: auto;">Love calculator</h2>

      <div style="text-align: center;">
         <form id="container">
                
            <label for="boyname">Boy: </label>
            <input id="boyname" type="text" name="boy" >
            <br>
            <label for="">Girl: </label>
            <input id="girlname" type="text" name="girl" required >
            <br>
            <button type="submit">Check</button>


       </form>
      </div>

      
       <h3 id="res" style="text-align: center; margin: auto;">Result:</h3>

</body>

</html>
