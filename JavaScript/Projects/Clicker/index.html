<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
          
            .circle{
                 
                height: 50px;
                width: 50px;
                /* opacity: 1; */
                /* opacity: 0; */
                border-radius: 50%;
                display: flex;
                justify-content: center;
                overflow: hidden;
                align-items: center;
                animation: circleanimation 4s forwards;
                position: absolute;
            }
            @keyframes circleanimation{
                 
                 0%{
                    font-size: 10px;
                    opacity: 1;
                    transform: scale(1);
                 }
                 100%{
                   
                    font-size: 50px;
                    transform: scale(2);
                    opacity: 0;
                 }
            }

    </style>
</head>
<body id="body" style="width: 100vw; height: 1000vh; position: relative;">
    
</body>

<script src="./index.js"></script>
</html>
