<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          
          #div1{
            height: 100px;
            width: 100px;
            margin-bottom: 25px;
            background-color: teal;

            transition: all 4s ease 1s;
            transform: scale(0.4);
          }
          #div1:hover{
            transform: scale(1);
            background-color: blueviolet;
          }
          #div2{
              
             height: 100px;
             width: 100px;
             background-color: yellowgreen;
             transition: all 3s;
          }

          #div2:active{
               
               background-color: red;
               width: 300px;
               transform: rotate(90deg);
                
          }
    </style>
</head>
<body>

    <div id="div1">
         2026
    </div>

    <div id="div2">

    </div>
    
</body>
</html>
