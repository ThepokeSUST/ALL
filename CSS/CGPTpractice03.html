<!DOCTYPE html>
<html>
<head>
<style>
/* Outer container */
#div2 {
    background-color: black;
    width: 100px;
    height: 300px;
    margin: 50px auto;      /* center horizontally on the page */
    display: flex;
    flex-direction: column; /* stack circles vertically */
    align-items: center;    /* center horizontally */
    justify-content: space-around; /* space evenly vertically */
    padding: 10px;          /* prevent margin collapse */
    border-radius: 10px;    /* optional: rounded box */
}

/* Circle styles */
.circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
}

/* Specific colors */
#red {
    background-color: red;
}

#yellow {
    background-color: yellow;
}

#green {
    background-color: green;
}
</style>
</head>
<body>

<div id="div2">
    <div id="red" class="circle"></div>
    <div id="yellow" class="circle"></div>
    <div id="green" class="circle"></div>
</div>

</body>
</html>
